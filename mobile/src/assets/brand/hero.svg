<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title description">
<title id="title">Volunteer Network banner</title>
<desc id="description">Connect people, skills and causes. Built with Relate by Neo4j for Hackathon 2026 by Cyber Scallywags.</desc>
<defs>
<radialGradient id="navy" cx="85%" cy="0%" r="100%"><stop stop-color="#10244c"/><stop offset=".65" stop-color="#0b1730"/><stop offset="1" stop-color="#090f22"/></radialGradient>
<radialGradient id="jade" cx="54%" cy="12%" r="90%"><stop stop-color="#a5fff0"/><stop offset=".32" stop-color="#49e7d5"/><stop offset=".75" stop-color="#05ab94"/><stop offset="1" stop-color="#006653"/></radialGradient>
<linearGradient id="body" x1="30%" x2="60%" y1="0%" y2="100%"><stop stop-color="#88ffec"/><stop offset=".4" stop-color="#13cdb5"/><stop offset="1" stop-color="#007765"/></linearGradient>
<radialGradient id="honey" cx="40%" cy="17%" r="86%"><stop stop-color="#fff9ce"/><stop offset=".45" stop-color="#ffdd65"/><stop offset=".82" stop-color="#ffb21c"/><stop offset="1" stop-color="#ffe38a"/></radialGradient>
<linearGradient id="cream" x2="0" y2="100%"><stop stop-color="#fff9e8"/><stop offset=".65" stop-color="#f8efd4"/><stop offset="1" stop-color="#cca16a"/></linearGradient>
