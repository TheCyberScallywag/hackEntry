# A neutral starting brand (CC0, see LICENSE). Copy this folder over brand/, replace the
# placeholders and the images, then run `uv run task sync`. Every field is described in the
# brand kit page of the docs.

[project]
name = "Example Project"  # display name: titles, app name, docs
tagline = "Replace this tagline"  # shown under the name
slug = "example-project"  # lower-case: distribution, images, compose project, cache keys
description = "A full-stack project: FastAPI, FastUI, Streamlit, Ionic and Neo4j"
year = 2026  # copyright year

[organisation]
name = "Example Organisation"
url = "https://example.org"
motto = ""

[repository]
owner = "example-org"
name = "example-project"

[mobile]
app_id = "org.example.exampleproject"  # Capacitor appId, reverse-DNS, no hyphens

[theme]
primary = "#264653"  # header bars, hero panels
secondary = "#2a9d8f"  # the rule's first colour
tertiary = "#e9c46a"  # badges and highlights
cream = "#ffffff"  # lettering on primary
font_display = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
font_mono = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"

# `accent` (links, buttons) and `highlight` must be readable as text on that scheme's surfaces.
[theme.light]
background = "#f7f7f4"
surface = "#ffffff"
text = "#1d2327"
muted = "#5b6770"
border = "#d9ddd8"
accent = "#1c6f65"
highlight = "#7a5a0a"

[theme.dark]
background = "#12181b"
surface = "#1b2428"
text = "#e8ecee"
muted = "#a2adb3"
border = "#2e3a40"
accent = "#4fc3b5"
highlight = "#e9c46a"

[theme.docs]
scheme = "auto"  # auto follows the reader's system; dark or light starts the manual there

[images]
logo = "logo.svg"
mark = "mark.svg"
favicon = "favicon.png"
hero = "hero.svg"
logo_alt = "Example Project logo: replace it with your own"
hero_alt = "Example Project: replace this banner with your own"

[docs]
kicker = "Example Organisation"

[auth]
mode = "mock"
