# Local demo stack:  docker compose up -d --build --wait   (or: uv run task up)
# Host ports default to 8080 (web), 8501 (admin), 8100 (mobile), 8200 (docs) and 8025 (the mail
# sidecar's inbox); override with WEB_PORT, ADMIN_PORT, MOBILE_PORT, DOCS_PORT and MAIL_PORT if
# those are taken.
# web and admin are built from one Dockerfile with different extras (the web image has no
# Streamlit) and share one named volume holding the SQLite database and the writable Relate store.
# On first start the web app copies the bundled read-only data/demo.rl into it and seeds the
# disposable demo accounts. `docker compose down -v` throws it all away.
# External access is opt-in: `docker compose --profile tunnel up -d` (or: uv run task tunnel) also
# starts a Cloudflare Tunnel connector, which needs CLOUDFLARE_TUNNEL_TOKEN in .env.

x-app-env: &app-env
  APP_ENV: test
  DATA_DIR: /data
  ORG_NAMES: ${ORG_NAMES:-}
  API_URL: http://web:8080   # the admin console is a client of the JSON API
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  SIGNUP_ENABLED: ${SIGNUP_ENABLED:-}   # false: nobody can create an account (default: true)
  AURA_URI: ${AURA_URI:-}
  AURA_USERNAME: ${AURA_USERNAME:-neo4j}
  AURA_PASSWORD: ${AURA_PASSWORD:-}
  AURA_DATABASE: ${AURA_DATABASE:-neo4j}
  # The assistants (src/app/agents) are off until AGENT_MODEL is set; traces go nowhere until
  # LOGFIRE_TOKEN is.
  AGENT_MODEL: ${AGENT_MODEL:-}
  AGENT_FALLBACK_MODEL: ${AGENT_FALLBACK_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
  # Organisations' onboarding emails go out through SMTP. By default that is the `mail`
  # sidecar below, which catches every message and delivers none. Point SMTP_HOST at a real
  # relay to send for real.
  SMTP_HOST: ${SMTP_HOST:-mail}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  PUBLIC_URL: ${PUBLIC_URL:-}

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 24

services:
  web:
    image: dvn/web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { EXTRAS: "--extra aura" }
    environment:
      <<: *app-env
      SERVICE: web
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    expose: [8080]
    volumes: [dvn-data:/data]
    networks: [dvn]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      <<: *health

  admin:
    image: dvn/admin:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args: { EXTRAS: "--extra admin" }
    environment:
      <<: *app-env
      SERVICE: admin
    ports: ["127.0.0.1:${ADMIN_PORT:-8501}:8501"]
    expose: [8501]
    volumes: [dvn-data:/data]
    networks: [dvn]
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      <<: *health

  mobile:
    image: dvn/mobile:local
    build: { context: ., dockerfile: docker/mobile.Dockerfile }   # runs lint + unit tests first
    environment:
      API_URL: http://web:8080
    ports: ["127.0.0.1:${MOBILE_PORT:-8100}:8080"]
    expose: [8100]
    networks: [dvn]
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      <<: *health

  docs:   # static docs: Zensical portal at /, Sphinx manual at /manual/
    image: dvn/docs:local
    build: { context: ., dockerfile: docker/docs.Dockerfile }   # fails on any docs warning
    ports: ["127.0.0.1:${DOCS_PORT:-8200}:8080"]
    expose: [8200]
    networks: [dvn]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      <<: *health

  # Mail sidecar: Mailpit takes the web app's onboarding emails over SMTP (mail:1025) and shows
  # them at http://localhost:8025. It never relays, so the demo cannot email a real address.
  mail:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 500
    ports: ["127.0.0.1:${MAIL_PORT:-8025}:8025"]
    expose: [1025, 8025]
    networks: [dvn]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      <<: *health

  # Cloudflare Tunnel connector (opt-in, profile "tunnel"). It dials out to Cloudflare, so it
  # publishes no host ports. The tunnel's public hostnames are set in the Cloudflare Zero Trust
  # dashboard and point at the Compose service names, e.g. http://web:8080 or http://mobile:8080.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # from .env; not required unless the profile is used
    restart: unless-stopped
    networks: [dvn]
    depends_on: { web: { condition: service_healthy } }

# One bridge network for the whole stack, so services reach each other by name (web, mail, ...).
networks:
  dvn:

volumes:
  dvn-data:
