# The brand (CC0, see LICENSE): identity, palette and images. This file is the only place a
# brand colour or the product name is written by hand. The web app and the admin console read it at start-up; the
# mobile app and the docs get generated copies from `uv run task sync` (src/app/brandkit.py),
# and `uv run task test` fails while any copy is out of date.

[project]
name = "Volunteer Network"  # display name, as on the logo: titles, app name, docs
slug = "hackentry"  # lower-case: distribution, images, compose project, cache keys
tagline = "Connect people, skills and causes"  # as on the hero banner
description = "One volunteer account across organisations, matched by a Relate graph"
year = 2026  # copyright year

[organisation]
name = "Cyber Scallywags"
url = ""
motto = ""

[repository]
owner = "cyberscallywags"
name = "hackentry"

[mobile]
app_id = "org.example.hackentry"  # Capacitor appId, reverse-DNS, no hyphens

# The palette of brand/images: a navy field, jade volunteers, a honey heart, cream lettering.
[theme]
primary = "#0b1730"  # navy: header bars, hero panels
secondary = "#31d8c5"  # jade: the rule under the wordmark
tertiary = "#ffdd65"  # honey: badges and highlights
cream = "#fff7e3"  # lettering on navy
# The logo is set in Montserrat; nothing is downloaded, so the next installed face is used.
font_display = "Montserrat, 'Avenir Next', 'Segoe UI', system-ui, sans-serif"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
font_mono = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"

# Each surface follows the reader's light or dark setting. `accent` is the jade and `highlight`
# the honey at a strength that is readable as text on that scheme's background (WCAG AA).
[theme.light]
background = "#fbf8ef"
surface = "#ffffff"
text = "#0b1730"
muted = "#4f5a73"
border = "#e0dccf"
accent = "#007765"
highlight = "#8a5a00"

[theme.dark]
background = "#090f22"
surface = "#0e1a36"
text = "#fff7e3"
muted = "#a8b3cc"
border = "#22325a"
accent = "#31d8c5"
highlight = "#ffdd65"

[theme.docs]
# "auto" follows the reader's system setting, like the web and mobile apps; "dark" or "light"
# starts the reference manual in that scheme instead. Readers can always switch.
scheme = "auto"

[images]
logo = "logo.svg"
mark = "mark.svg"
favicon = "favicon.png"
hero = "hero.svg"
logo_alt = "Volunteer Network logo: three jade volunteers around a golden heart"
hero_alt = "Volunteer Network: connect people, skills and causes. Built with Relate by Neo4j for Hackathon 2026 by Cyber Scallywags"

[docs]
kicker = "Cyber Scallywags"

[auth]
mode = "mock"
