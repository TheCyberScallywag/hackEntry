[project]
name = "hackentry"
version = "0.2.0"
description = "Volunteer Network: one volunteer account across organisations, matched by a Relate graph"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "argon2-cffi>=25.1",
    # Embedded Relate engine. Pinned to the same version as the tested `relate` CLI (1.0.1), so
    # the bundled data/demo.rl can be opened by either.
    "relate-db==1.0.1",
]

[project.optional-dependencies]
aura = ["neo4j>=6.0,<7"]  # optional AuraDB push + match parity (python -m app.cli aura-*)
admin = ["streamlit>=1.50", "httpx>=0.28"]  # the console is a client of the JSON API

[dependency-groups]
dev = [
    "httpx>=0.28",  # FastAPI TestClient
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "pre-commit>=4.3",
    "taskipy>=1.14",
    "git-cliff>=2.10",
]
admin = ["hackentry[admin]"]
aura = ["hackentry[aura]"]
# Documentation (restored from the sgaffald template): one Markdown source in docs/content, built
# twice: Zensical (portal, /) and Sphinx + Furo (reference manual, /manual/). Opt-in, so the
# web image stays lean: uv sync --group docs.
docs = [
    "sphinx>=9.2",
    "furo>=2025.12.19",
    "myst-parser>=5.1",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-mermaid>=2.1",
    "sphinx-autobuild>=2025.8.25",
    "zensical>=0.0.71",
    "mkdocstrings-python>=2.0.10",
    "taskipy>=1.14",  # the docs image runs `task docs`, the same build as local
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.force-include]
"brand/brand.toml" = "app/brand/brand.toml"
"brand/images" = "app/brand/images"
"data/fixtures" = "app/fixtures"
"data/orgs" = "app/orgs"
"data/demo.rl" = "app/demo.rl"

# ---------------------------------------------------------------- taskipy
[tool.taskipy.settings]
use_vars = true

[tool.taskipy.variables]
# The brand's home and about pages and images, copied into the docs (git-ignored copies); the
# about page gets its contributors from brand/docs/contributors.json on the way.
docs_brand = "python -m app.cli brand && mkdir -p docs/content/assets/brand && cp brand/docs/home.md docs/content/index.md && python -m app.cli about --out docs/content/about.md && cp brand/images/* docs/content/assets/brand/"
# Portal first (its --clean empties the site dir), then the manual into site/manual.
docs_build = { var = "{docs_brand} && zensical build --strict --clean -f docs/zensical.toml && sphinx-build -W --keep-going -q -b html -c docs/sphinx docs/content docs/_build/site/manual", recursive = true }

[tool.taskipy.tasks]
web = { cmd = "python -m app.serve web", help = "Run the web app on http://localhost:8080 (seeds the demo on first start)" }
admin = { cmd = "python -m app.serve admin", help = "Run the Streamlit admin on http://localhost:8501 (needs uv sync --group admin)" }
reset = { cmd = "python -m app.cli reset --demo", help = "Wipe var/ and reseed the disposable demo (SQLite + writable copy of data/demo.rl)" }
sync = { cmd = "python -m app.cli brand", help = "Write the mobile and docs copies of brand/ (theme, images, names); task test fails while one is stale" }
contributors = { cmd = "python -m app.cli contributors --repo TheCyberScallywag/hackEntry", help = "Refresh brand/docs/contributors.json (the About page's list) from the GitHub contributors" }
bundle = { cmd = "python -m app.cli bundle", help = "Rebuild the committed data/demo.rl from data/fixtures" }
inspect = { cmd = "python -m app.cli inspect --store data/demo.rl", help = "Run the sample graph inspection query on the bundled store" }
lint = { cmd = "ruff check . && ruff format --check .", help = "Ruff lint + format check" }
format = { cmd = "ruff format . && ruff check --fix .", help = "Auto-format and fix" }
hooks = { cmd = "pre-commit run --all-files", help = "Run every pre-commit hook on every file" }
changelog = { cmd = "git-cliff --output CHANGELOG.md", help = "Regenerate CHANGELOG.md from the commit prefixes (git-cliff, cliff.toml); replaces the file" }
changelog_preview = { cmd = "git-cliff --unreleased", help = "Print the unreleased changelog section without writing anything" }
test = { cmd = "pytest", help = "All tests: temporary SQLite + real Relate stores" }
up = { cmd = "docker compose up -d --build --wait", help = "Build + start web, admin and mobile" }
tunnel = { cmd = "docker compose --profile tunnel up -d --build --wait", help = "Start the stack plus the Cloudflare Tunnel connector (needs CLOUDFLARE_TUNNEL_TOKEN in .env)" }
down = { cmd = "docker compose --profile tunnel down -v", help = "Stop the stack (and the tunnel, if running) and drop its volume" }
docs = { cmd = "{docs_build}", help = "Build the Zensical portal and the Sphinx manual into docs/_build/site" }
docs_serve = { cmd = "{docs_build} && python -m http.server 8200 -d docs/_build/site", help = "Build, then serve the portal (/) and manual (/manual/) on http://localhost:8200" }
docs_live = { cmd = "{docs_brand} && zensical serve -f docs/zensical.toml -a localhost:8201", help = "Live-reload the Zensical portal on :8201 while writing" }
docs_live_manual = { cmd = "{docs_brand} && sphinx-autobuild -c docs/sphinx docs/content docs/_build/live-manual --port 8202", help = "Live-reload the Sphinx manual on :8202 while writing" }

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "aura: needs AURA_URI/AURA_PASSWORD for a designated dev AuraDB instance",
    "compose: needs a Docker daemon and the stack started with task up",
]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["mobile"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "TD"]
ignore = [
    "S101",  # asserts are fine in tests
    "TD003",
    "S608",  # SQL built only from fixed fragments; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
"src/app/cli.py" = ["S603", "S607"]
