# The docs portal (Zensical), restored from the sgaffald template. Build: uv run task docs
# Live: uv run task docs_live. site_name, site_description, site_author and copyright are
# written from brand/brand.toml by `uv run task sync`; the colours are assets/stylesheets. Pages live in docs/content and are shared with the Sphinx manual
# (docs/sphinx); keep `nav` in step with the toctrees in content/manual.md.
# index.md, about.md and assets/brand/ are copied from brand/ by the docs tasks (git-ignored).

[project]
site_name = "Volunteer Network"
site_description = "Volunteer Network: One volunteer account across organisations, matched by a Relate graph"
site_author = "Cyber Scallywags"
copyright = "© 2026 Cyber Scallywags"
docs_dir = "content"
site_dir = "_build/site"
# Sphinx-only pages; the manual is built into _build/site/manual after the portal.
exclude_docs = """
manual.md
reference/python-api-sphinx.md
"""

extra_css = [
  "assets/stylesheets/brand.css",
  "assets/stylesheets/template.css",
  "assets/stylesheets/zensical.css",
  "assets/stylesheets/brand-extra.css",
]

nav = [
  { "Home" = "index.md" },
  { "Project" = [
    "project/solution-architecture.md",
    "project/relate.md",
    "project/tooling.md",
    "project/demo-script.md",
    "project/verification.md",
    "project/devpost.md",
    "project/reuse-and-attribution.md",
  ] },
  { "Reference" = [
    "reference/python-api.md",
    { "Manual (Sphinx)" = "/manual/" },
  ] },
  { "About" = "about.md" },
]

[project.theme]
language = "en"
logo = "assets/brand/mark.svg"
favicon = "assets/brand/favicon.png"
font = false  # no web fonts are downloaded: the stacks are the brand's (--brand-font, --brand-mono)
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

# Follows the reader's system setting, like the web and mobile apps; readers can switch.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"  # the brand's colours (assets/stylesheets/zensical.css), not a built-in set
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["../src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
show_root_heading = true
show_source = false
heading_level = 2
